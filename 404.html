<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сторінку не знайдено — Marielle</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF8F5">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .nf { min-height: 100svh; display: grid; place-items: center; text-align: center; padding-block: 80px; }
  .nf__n {
    font-family: var(--ff-display); font-size: clamp(6rem, 22vw, 15rem);
    line-height: .86; color: var(--accent); margin: 0;
  }
  .nf__s { width: clamp(28px, 5vw, 46px); color: var(--accent); margin: 28px auto; }
  .nf p { max-width: 44ch; margin-inline: auto; }
  .nf__go { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 36px; }
</style>
</head>

<body>
<svg class="hidden" aria-hidden="true"><defs>
  <symbol id="spark" viewBox="0 0 100 100"><path fill="currentColor" d="M50 1 Q53.6 46.4 99 50 Q53.6 53.6 50 99 Q46.4 53.6 1 50 Q46.4 46.4 50 1 Z"/></symbol>
</defs></svg>

<main class="nf wrap">
  <div>
    <a class="logo" href="index.html" aria-label="Marielle — на головну" style="font-size:1.7rem">
      <span>Mar<span class="logo__i">ı<span class="logo__spark"><svg viewBox="0 0 100 100"><use href="#spark"/></svg></span></span>elle</span>
    </a>

    <p class="nf__n">404</p>
    <div class="nf__s"><svg viewBox="0 0 100 100"><use href="#spark"/></svg></div>

    <h1 style="font-size:clamp(1.8rem,3.4vw,2.8rem)">Такої сторінки немає</h1>
    <p class="lead">
      Можливо, посилання застаріло або річ уже розпродана.
      Загляньте в каталог — там усе, що зараз є в наявності та під замовлення.
    </p>

    <div class="nf__go">
      <a class="btn" href="catalog.html">До каталогу</a>
      <a class="btn btn--ghost" href="index.html">На головну</a>
      <a class="btn btn--ghost" href="https://t.me/marielle_ua" target="_blank" rel="noopener">Написати нам</a>
    </div>
  </div>
</main>

<script>
/* тема береться з того ж сховища, що й на решті сайту */
(function () {
  try {
    var t = localStorage.getItem('mrl.theme');
    if (t) document.documentElement.setAttribute('data-theme', t.replace(/"/g, ''));
    else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
})();
</script>
</body>
</html>
